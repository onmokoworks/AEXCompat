[package]
name = "aexcompat-aviutl2-multifilter"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "AviUtl2 generic (.aux2) plugin registering each AEX in a folder as its own keyframeable filter (issue #295)"

# Standalone, intentionally outside the broker workspace (same as the aviutl2
# bridge): the aviutl2 dependency tree must not enter the broker gate.
[lib]
name = "aexcompat_aviutl2_multifilter"
crate-type = ["cdylib"]

[dependencies]
aviutl2-sys = "0.40"
libffi = "5.1.1"
# The AEXCompat broker, driven in-process. RenderSession::open spawns the
# isolated worker subprocess, so the untrusted AEX stays out-of-process even
# though this plugin is loaded in-process by AviUtl2.
aexcompat-broker = { path = "../../broker/crates/broker" }
sha2 = "0.10"
toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Read AviUtl2's virtual buffer (a GPU-only DXGI R16G16B16A16_FLOAT texture) back
# to the CPU via a D3D11 staging copy, to feed an AEX layer parameter (issue #645).
half = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

# Diagnostic examples (issue #304): discover_timing (serial vs parallel timing),
# discover_with_deps (one plug-in with its sealed closure), and discover_sweep
# (unlock rate over a whole plug-in folder). They use only the crate's own
# dependencies plus the broker's public API.
