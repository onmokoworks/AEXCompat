[package]
name = "aex-guest-worker"
version = "0.1.0"
edition.workspace = true
license = "GPL-2.0-only"

[features]
default = []
native-carrier = []
wgpu-metal-experimental = [
    "dep:aex-clspv",
    "dep:aex-wgpu-compute",
]

[dependencies]
aex-abi = { path = "../aex-abi" }
aex-apple-opencl = { path = "../aex-apple-opencl" }
aex-clspv = { path = "../aex-clspv", optional = true }
aex-unicorn-buffer = { path = "../aex-unicorn-buffer" }
aex-wgpu-compute = { path = "../aex-wgpu-compute", optional = true }
encoding_rs = "0.8"
unicode-normalization = "0.1"
goblin.workspace = true
iced-x86.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicorn-engine.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aex-guest-worker"
path = "src/main.rs"
