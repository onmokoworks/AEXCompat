[workspace]
members = ["crates/aex-abi", "crates/aex-guest-worker"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe64"] }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
