[workspace]
members = [
    "crates/aex-abi",
    "crates/aex-apple-opencl",
    "crates/aex-clspv",
    "crates/aex-guest-worker",
    "crates/aex-unicorn-buffer",
    "crates/aex-wgpu-compute",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe64"] }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
