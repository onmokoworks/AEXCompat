[package]
name = "aexcompat-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
windows-sys.workspace = true
windows.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
object = { version = "0.39.1", default-features = false, features = ["read", "pe", "std"] }

[lib]
name = "aexcompat_broker"
path = "src/lib.rs"

[[bin]]
name = "broker"
path = "src/main.rs"

[[bin]]
name = "opencl-runtime-probe-worker"
path = "src/bin/opencl_runtime_probe_worker.rs"

[[bin]]
name = "cuda-compute-probe-worker"
path = "src/bin/cuda_compute_probe_worker.rs"
