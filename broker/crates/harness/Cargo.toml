[package]
name = "aexcompat-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.31"
rfd = "0.15"
serde_json = "1"
sha2 = "0.10"
aexcompat-broker = { path = "../broker" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
goblin = "0.10.7"
tracing = "0.1.44"

[[bin]]
name = "aexcompat-harness"
path = "src/main.rs"
