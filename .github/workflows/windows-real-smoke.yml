name: Windows real runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-real-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, windows-real]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh --version
          cmake --version
          ninja --version

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsRoot) {
            throw 'Visual Studio C++ tools were not found.'
          }
          Write-Host "Visual Studio C++ tools: $vsRoot"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Check Rust workspace
        working-directory: broker
        run: cargo check --workspace --locked

      - name: Verify Python dependencies
        run: uv run python -c "import pytest; import PIL; import jsonschema; import OpenEXR; print('Python dependencies import successfully')"
