name: Windows real PR 391

on:
  push:
    branches: [agent/windows-real-smoke]

permissions:
  contents: read

concurrency:
  group: windows-real-pr391
  cancel-in-progress: true

jobs:
  resolve-ofx-native-smoke:
    runs-on: [self-hosted, Windows, X64, windows-real]
    timeout-minutes: 30
    steps:
      - name: Check out PR 391
        uses: actions/checkout@v4
        with:
          ref: codex/issue388-resolve-ofx

      - name: Confirm Resolve is not used
        shell: pwsh
        run: |
          $resolve = 'C:\Program Files\Blackmagic Design\DaVinci Resolve\Resolve.exe'
          Write-Host "Resolve installed: $(Test-Path -LiteralPath $resolve)"
          Get-Process -Name Resolve,OFXLoader -ErrorAction SilentlyContinue |
            ForEach-Object { throw "Resolve process is unexpectedly running: $($_.ProcessName)" }

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run focused OFX tests
        run: uv run python -m pytest -q tests/test_resolve_ofx_surface.py

      - name: Build and run native OFX smoke
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S bridges\resolve-ofx -B target\resolve-ofx -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build target\resolve-ofx || exit /b 1
          target\resolve-ofx\resolve_ofx_smoke.exe target\resolve-ofx\AEXCompatResolve.ofx || exit /b 1
