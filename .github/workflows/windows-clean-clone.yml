name: Windows clean clone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-reproducible:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      # clean clone は mtime が毎回新しく、rust-cache だけでは workspace
      # クレートが常に再コンパイルされる。sccache が内容ハッシュで吸収する (#664)。
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Check Rust formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            $base = 'HEAD^'
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base $env:GITHUB_SHA -- '*.rs')
          if (-not $files) {
            Write-Host 'No changed Rust files to format-check.'
            exit 0
          }
          rustfmt --edition 2024 --check --config skip_children=true @files
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            broker
            bridges/aviutl2
            bridges/aviutl2-multifilter
      # Python 版は .python-version (3.12) に従う。
      # setup-uv は v8 から floating major tag (@v8) を出していないので full tag で pin する。
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      - name: Check Rust workspace
        working-directory: broker
        run: cargo check --workspace --locked
      - name: Check AviUtl2 bridge
        run: cargo check --manifest-path bridges/aviutl2/Cargo.toml --all-targets --locked
      - name: Check AviUtl2 multifilter bridge
        run: cargo check --manifest-path bridges/aviutl2-multifilter/Cargo.toml --all-targets --locked
      # Hosted runners execute as a service account whose restricted token cannot
      # initialize even a static Rust worker (0xC0000142). The tests that drive a
      # live worker detect that themselves now (broker/crates/broker/tests/common,
      # issue #335) and report a skip line instead of failing. Rejection tests that
      # never start a process keep running: RenderSession::open validates every
      # argument before it launches, and secure_launch fails trusted worker staging
      # before it spawns, so those refusals are still covered here. The old --skip
      # list is gone because it did not follow the tests added after it was
      # written, which left main red with 32 failures.
      #
      # --show-output is required, not cosmetic: libtest captures stdout/stderr of
      # passing tests, and a skipped test passes. Without it the skip lines are
      # swallowed and a run that could not launch a single worker is
      # indistinguishable from full coverage.
      - name: Test Rust workspace
        working-directory: broker
        shell: pwsh
        # The opt-in is what lets the probe suppress a worker-launching test at
        # all. Only the two CI workflows set it (here and in ae-sdk-tests.yml for
        # the pytest side), so a regression in the restricted token -- which
        # produces the same 0xC0000142 the probe keys on -- fails loudly on a
        # developer machine instead of skipping (issue #335).
        env:
          AEXCOMPAT_ALLOW_RESTRICTED_TOKEN_SKIP: "1"
        run: |
          cargo test --workspace --locked -- --show-output 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/cargo-test-output.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Make the environment limitation visible in the run summary rather than
      # leaving it as a passing test count. Reports either way, so "no skips" is
      # an explicit statement instead of the absence of one.
      - name: Report restricted-token skips
        shell: pwsh
        if: always()
        run: |
          if (-not (Test-Path cargo-test-output.txt)) {
            Write-Host 'cargo test produced no log; nothing to report.'
            exit 0
          }
          $skips = Select-String -Path cargo-test-output.txt `
            -Pattern 'cannot launch a restricted-token worker'
          if ($skips) {
            Write-Host "::warning::$($skips.Count) Rust tests did not run: this runner cannot launch a restricted-token worker (issue #335)"
            $skips | ForEach-Object { $_.Line }
          } else {
            Write-Host 'Every worker-launching Rust test ran: no restricted-token skips.'
          }
      - name: Validate Python collection and local-artifact manifest
        run: uv run python -m pytest --collect-only -q --validate-local-artifact-manifest
      # loadscope: 同一モジュールのテストを同一 worker に直列化する。テストは
      # 共有ディレクトリに time.time_ns() 名でファイルを書く箇所が多数あり、
      # Windows の time_ns は ~1ms 粒度なので module を跨いで並走させると
      # 同名衝突で flake する (#664 で実測)。
      - name: Run source-reproducible Python tests
        run: uv run python -m pytest -q -n auto --dist loadscope --durations=25
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
