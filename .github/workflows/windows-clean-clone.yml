name: Windows clean clone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-reproducible:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: broker
      # Python 版は .python-version (3.12) に従う。
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      - name: Check Rust workspace
        working-directory: broker
        run: cargo check --workspace --locked
      - name: Test Rust workspace
        working-directory: broker
        # Hosted runners execute as a service account whose restricted token cannot
        # initialize even a static Rust worker (0xC0000142). Keep rejection tests in
        # CI, but leave positive restricted-token launch coverage to a local runner.
        run: >-
          cargo test --workspace --locked --
          --skip external_worker_reads_sealed_plugin_and_tree_is_cleaned_after_exit
          --skip timeout_kills_worker_and_cleans_sealed_and_staged_trees
      - name: Validate Python collection and local-artifact manifest
        run: uv run python -m pytest --collect-only -q --validate-local-artifact-manifest
      - name: Run source-reproducible Python tests
        run: uv run python -m pytest -q
