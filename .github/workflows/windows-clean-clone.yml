name: Windows clean clone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-clean-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-reproducible:
    # Keep untrusted public-repository jobs off the physical workstation.
    # Private repositories use it while USE_SELF_HOSTED_RUNNER stays enabled.
    runs-on: ${{ github.event.repository.private && vars.USE_SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","windows-real"]') || 'windows-latest' }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      # clean clone は mtime が毎回新しく、rust-cache だけでは workspace
      # クレートが常に再コンパイルされる。sccache が内容ハッシュで吸収する (#664)。
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Check Rust formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            $base = 'HEAD^'
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base $env:GITHUB_SHA -- '*.rs')
          if (-not $files) {
            Write-Host 'No changed Rust files to format-check.'
            exit 0
          }
          rustfmt --edition 2024 --check --config skip_children=true @files
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            broker
            bridges/aviutl2
            bridges/aviutl2-multifilter
            bridges/ymm4-native
      # Python 版は .python-version (3.12) に従う。
      # setup-uv は v8 から floating major tag (@v8) を出していないので full tag で pin する。
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      - name: Check Rust workspace
        working-directory: broker
        run: cargo check --workspace --locked
      - name: Check AviUtl2 bridge
        run: cargo check --manifest-path bridges/aviutl2/Cargo.toml --all-targets --locked
      - name: Check AviUtl2 multifilter bridge
        run: cargo check --manifest-path bridges/aviutl2-multifilter/Cargo.toml --all-targets --locked
      # broker の外にある Cargo ルートは cargo check で型検査されるだけで、
      # テストが 1 本も実行されていなかった (#899)。guest workspace は libclang を
      # 必要とし runner に無いため #917 に分離した。
      - name: Test AviUtl2 multifilter bridge
        run: cargo test --manifest-path bridges/aviutl2-multifilter/Cargo.toml --locked
      - name: Test YMM4 native bridge
        run: cargo test --manifest-path bridges/ymm4-native/Cargo.toml --locked
      # PR ゲートで minihost の C++ をコンパイルする (#884)。ae-sdk-tests の
      # 手動無効化 (#721) 以降、minihost を触る PR はコンパイルすら検証されずに
      # merge できた。minihost のビルドは AFTER_EFFECTS_SDK_ROOT を参照しない
      # ので、SDK fetch を持たないこの workflow に置ける。probe AEX のビルドと
      # SDK 付き pytest の復旧は ae-sdk-tests 側 (#721) が担当する。
      - name: Build minihost workers (Ninja)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S minihost -B target\minihost-build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build target\minihost-build || exit /b 1
          dir /b target\minihost-build\aex_*.exe
      # ヘッダ依存が実際に記録されているかを確認する (#657)。cl の /showIncludes
      # はローカライズされるため、configure 時と build 時で言語が食い違うと
      # ninja は依存を 0 件記録し、以後ヘッダを変えても再ビルドされない (#651)。
      - name: Verify minihost header dependency tracking
        shell: pwsh
        run: pwsh -File tools\verify-minihost-build-deps.ps1
      - name: Test Rust workspace
        working-directory: broker
        shell: pwsh
        run: cargo test --workspace --locked
      - name: Validate Python collection and local-artifact manifest
        run: uv run python -m pytest --collect-only -q --validate-local-artifact-manifest
      # worksteal: ビルドでブロックした worker の積み残しを他の worker が
      # 引き取る。time_ns ファイル名の worker 間衝突は stamp への pid 付与で
      # 解消済みなので、モジュール直列化 (loadscope) はもう要らない (#668)。
      # dev_infra (レビュー運用スキルのテスト) は下の dev-infra job が担当 (#684)。
      - name: Run source-reproducible Python tests
        run: uv run python -m pytest -q -n auto --dist worksteal --durations=25 -m "not dev_infra"
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # 開発インフラ (codex-review-loop の bash/jq 関数) のテスト。中身は
  # プラットフォーム非依存の bash+jq で、プロセス起動が速い ubuntu で回す
  # 方が Windows 本体 job より数倍速い (#684)。
  dev-infra:
    # This job ran on Ubuntu before the self-hosted runner existed; the
    # non-self-hosted arm keeps that path for a public repository.
    runs-on: ${{ github.event.repository.private && vars.USE_SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","windows-real"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      # skip はゲートする: bash/jq が見つからない環境ではこれらのテストは
      # pytest.skip になるが、それを緑として扱うと job の存在意義が消える。
      - name: Run dev-infra tests
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest -q -m dev_infra | tee pytest-infra.txt
          if grep -qE "[0-9]+ skipped" pytest-infra.txt; then
            echo "::error::dev-infra tests were skipped instead of running"
            exit 1
          fi
