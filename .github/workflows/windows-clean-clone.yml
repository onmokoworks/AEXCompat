name: Windows clean clone

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC = 12:00 JST。
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-clean-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-reproducible:
    # Keep untrusted public-repository jobs off the physical workstation.
    runs-on: ${{ github.event.repository.private && vars.USE_SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","windows-real"]') || 'windows-latest' }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      # built_artifact テストが動かす broker/harness を debug から取る (#945)。
      # `cargo build --workspace` が既に両方を生成しているので、release で
      # もう一度 aexcompat-broker / host-core / harness を作る必要がない。
      # 既定は release のままで、tools/ の手動ゲートは影響を受けない。
      AEXCOMPAT_CARGO_PROFILE: debug
      # mtime 復元 (#935) が拾えなかった、実際に変更されたクレートを sccache が
      # 内容ハッシュで吸収する (#664)。
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SDK_RELEASE_TAG: ci-sdk-ae25.2
      SDK_ASSET: AfterEffectsSDK-ae25.2-win.zip
      SDK_SHA256: ADB59B2C7F7A95A901F70DB15D679BFB89055A0E03176E7BC65ACC75CC3B359F
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Check Rust formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            $base = 'HEAD^'
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base $env:GITHUB_SHA -- '*.rs')
          if (-not $files) {
            Write-Host 'No changed Rust files to format-check.'
            exit 0
          }
          rustfmt --edition 2024 --check --config skip_children=true @files
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            broker
            bridges/aviutl2-multifilter
            bridges/ymm4-native
      # Python 版は .python-version (3.12) に従う。
      # setup-uv は v8 から floating major tag (@v8) を出していないので full tag で pin する。
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      # Runs after the cache restore, so the restored target/ stays newer than
      # every source cargo does not need to rebuild, and before the first cargo
      # invocation below (#935).
      - name: Restore source timestamps from git
        run: uv run python tools/restore-mtime.py

      # SDK asset は collaborator 限定なので、public repository と fork PR は
      # ここから下の SDK 依存ステップに到達してはならない。job ごと落とすのでは
      # なく個々のステップを条件付けし、source-only の検証は fork でも走らせる。
      - name: Fetch After Effects SDK
        id: sdk
        if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP $env:SDK_ASSET
          gh release download $env:SDK_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:SDK_ASSET --output $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne $env:SDK_SHA256) { throw "SDK asset hash mismatch: expected $env:SDK_SHA256, got $hash" }
          $dest = Join-Path $env:RUNNER_TEMP 'aesdk'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = Join-Path $dest 'AfterEffectsSDK'
          if (-not (Test-Path (Join-Path $root 'Examples\Headers\AE_Effect.h'))) {
            throw 'extracted SDK is missing Examples\Headers\AE_Effect.h'
          }
          "AFTER_EFFECTS_SDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `cargo check` は後続の build/test と型検査が丸ごと重なる: check が出す
      # rmeta は codegen に使い回されないので、同じコードを二度検査していた
      # だけだった (#940)。代わりに fixture の build をここまで前倒しして、
      # コンパイルエラーが SDK 取得や probe ビルドより前に出る位置を保つ。
      #
      # dummy-workers の fixture をテスト実行と同じ feature 解決でビルドして
      # おくことで、テスト側が `cargo build -p ...` を起動して外側のビルドと
      # fingerprint を奪い合わずに済む (#937)。
      - name: Build the workspace fixtures
        working-directory: broker
        run: cargo build --workspace --locked

      # broker の外にある Cargo ルートは長らく型検査されるだけで、テストが
      # 1 本も実行されていなかった (#899)。guest workspace は libclang を
      # 必要とし runner に無いため #917 に分離した。
      - name: Test AviUtl2 multifilter bridge
        run: cargo test --manifest-path bridges/aviutl2-multifilter/Cargo.toml --locked
      - name: Test YMM4 native bridge
        run: cargo test --manifest-path bridges/ymm4-native/Cargo.toml --locked

      # docs/BUILD_REQUIREMENTS.md の指示どおり target\minihost-build 直下に
      # フラット配置する (single-config)。
      - name: Build minihost workers (Ninja)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S minihost -B target\minihost-build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build target\minihost-build || exit /b 1
          dir /b target\minihost-build\aex_*.exe
      # ヘッダ依存が実際に記録されているかを確認する (#657)。cl の /showIncludes
      # はローカライズされるため、configure 時と build 時で言語が食い違うと
      # ninja は依存を 0 件記録し、以後ヘッダを変えても再ビルドされない (#651)。
      - name: Verify minihost header dependency tracking
        shell: pwsh
        run: pwsh -File tools\verify-minihost-build-deps.ps1

      # trace writer の動的テスト (test_production_worker_trace.py /
      # test_instruments_trace_writer.py の handle ベース検証) を実走させる (#250)。
      # この target は trace_writer.cpp + windows.h のみで SDK 不要。
      - name: Build trace writer selftest (Ninja)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S instruments -B target\instruments-build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build target\instruments-build --target trace_writer_selftest || exit /b 1
          dir /b target\instruments-build\trace_writer_selftest.exe

      # 一部の built_artifact テストは worker を multi-config 時代の固定パス
      # から探すため、同一バイナリを複製して満たす。これらのテストは frozen hash を
      # 照合しないので複製で問題ない。
      - name: Mirror workers into expected build layouts
        shell: cmd
        run: |
          for %%d in ("target\minihost-build-v18" "target\minihost-build-v18\Release" "target\minihost-build\Release" "target\minihost-timed-layers\Release") do (
            mkdir %%d 2>nul
            copy /y target\minihost-build\aex_*.exe %%d\ >nul || exit /b 1
          )

      # probe テストの入力 fixture (37x23 raw RGBA)。内容は決定論的に生成され、
      # built_artifact テストは期待値を実行時に自己計算するため内容非依存。
      - name: Generate probe input fixture
        shell: cmd
        run: |
          mkdir target\gpu-effects 2>nul
          uv run python tools\generate-oracle-rgba-input.py --width 37 --height 23 --alpha-mode opaque --out target\gpu-effects\opencl-input.png || exit /b 1
          uv run python tools\png-to-rgba-raw.py --png target\gpu-effects\opencl-input.png --out target\gpu-effects\opencl-input.rgba || exit /b 1

      # 各 probe は自分だけの source (instruments\pf-*-probe) と build
      # ディレクトリ (target\pf-*-probe-build) を持ち、出力を共有しないので
      # 同時に走らせられる。直列だと 1 本あたり約 3.4 秒 x 24 本で 86 秒
      # かかっていた (#940)。並列だと出力が混ざって読めないので probe ごとに
      # 捕まえ、落ちたものだけまとめて出す。cmd の for ループと違い最初の
      # 失敗で打ち切らないため、1 回の実行で全滅か 1 本かが分かる。
      - name: Build probe AEX set
        if: steps.sdk.outcome == 'success'
        shell: pwsh
        run: |
          $repository = $PWD.Path
          # pwsh の PSModulePath のままだと子の Windows PowerShell 5.1 が
          # 自分のモジュールを見つけられない。cmd 版が先頭に足していたのと
          # 同じ 2 つを入れる (プロセス環境なので子プロセスに継承される)。
          $env:PSModulePath = "$env:ProgramFiles\WindowsPowerShell\Modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules;$env:PSModulePath"
          $probes = @(
            'build-pf-sampling-probe'
            'build-pf-aegp-async-layer-receipt-probe'
            'build-pf-aegp-external-cache-roundtrip-probe'
            'build-pf-aegp-fast-blur-probe'
            'build-pf-aegp-layer-options-probe'
            'build-pf-aegp-layer-receipt-probe'
            'build-pf-aegp-owned-world-probe'
            'build-pf-aegp-platform-world-probe'
            'build-pf-aegp-render-options4-tail-probe'
            'build-pf-aegp-render-suite5-probe'
            'build-pf-convolve-depth-probe'
            'build-pf-parameter-echo-probe'
            'build-pf-layer-param-probe'
            'build-pf-param-utils-animation-probe'
            'build-pf-smart-geometry-probe'
            'build-pf-smart-param-time-probe'
            'build-pf-transfer-mask-probe'
            'build-pf-transfer-rect-probe'
            'build-pf-transform-affine-probe'
            'build-pf-custom-ui-probe'
            'build-pf-frame-resize-probe'
            'build-pf-visual-audio-probe'
            'build-pf-color-settings-abi-probe'
            'build-pf-transform-multimatrix-oracle'
          )
          $throttle = [Math]::Min([Environment]::ProcessorCount, $probes.Count)
          Write-Host "building $($probes.Count) probes with throttle $throttle"
          $results = $probes | ForEach-Object -Parallel {
            $script = Join-Path $using:repository "tools\$_.ps1"
            $output = & powershell -NoProfile -ExecutionPolicy Bypass -File $script 2>&1 | Out-String
            [pscustomobject]@{ Probe = $_; ExitCode = $LASTEXITCODE; Output = $output }
          } -ThrottleLimit $throttle
          $failed = @($results | Where-Object { $_.ExitCode -ne 0 })
          foreach ($failure in $failed) {
            Write-Host "::group::probe build failed: $($failure.Probe) (exit $($failure.ExitCode))"
            Write-Host $failure.Output
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            throw "probe builds failed: $(($failed.Probe) -join ', ')"
          }

      # built_artifact テスト (test_sdk_backwards_audio_worker) が参照する
      # SDK example fixture。pytest の収集順に依存しないよう事前にビルドする。
      - name: Build SDK example fixtures (built-artifact deps)
        if: steps.sdk.outcome == 'success'
        shell: cmd
        run: |
          set "PSModulePath=%ProgramFiles%\WindowsPowerShell\Modules;%SystemRoot%\System32\WindowsPowerShell\v1.0\Modules;%PSModulePath%"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-sdk-backwards.ps1 || exit /b 1

      # #356: parameter-animation の統合テストは native worker と AEX fixture を
      # これらの正確なパスから探し、無ければ黙って return する。成果物の不在を
      # カバレッジと取り違えないよう、fail-closed に検査してから workspace の
      # テストに入る。
      #
      # 以前はここで `cargo test -p aexcompat-broker --test parameter_animation`
      # も走らせていたが、この test target は `cargo test --workspace` にも
      # 含まれており同じ 2 件を二度実行していた。しかも `-p` の狭い選択は
      # `--workspace` と feature 解決が違うので aexcompat-broker と
      # aexcompat-host-core を作り直していた (#948)。検査をテストより前に
      # 置けば「workspace 実行の時点で成果物があった」と順序で言い切れる。
      - name: Check native parameter-animation coverage inputs
        if: steps.sdk.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $required = @(
            (Join-Path $root 'target\minihost-build\aex_render_worker.exe'),
            (Join-Path $root 'target\pf-layer-param-probe-build\Release\pf_layer_param_probe.aex'),
            (Join-Path $root 'target\pf-param-utils-animation-probe-build\Release\pf_param_utils_animation_probe.aex')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "#356 native coverage prerequisite is missing: $path"
            }
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "coverage_artifact=$($file.FullName) size=$($file.Length) sha256=$hash"
          }
          $commit = git -C $root rev-parse HEAD
          Write-Host "coverage_source_commit=$commit"

      - name: Test Rust workspace
        working-directory: broker
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Validate Python collection and local-artifact manifest
        run: uv run python -m pytest --collect-only -q --validate-local-artifact-manifest

      # SDK と built artifact を揃えた 1 回の実行で全部を賄う。分かれていた頃は
      # ae-sdk-tests が source-only 集合をそのまま再実行していた (#681)。
      # cmd で実行する: pwsh の step から spawn すると、テストが起動する
      # powershell.exe (5.1) が pwsh 用の PSModulePath を継承してしまい、
      # Get-FileHash 等の組み込み cmdlet を解決できなくなる。
      - name: Run Python tests
        shell: cmd
        env:
          # 前段の Build minihost workers がビルド済みの worker を
          # canonical_release_worker fixture に渡し、二重ビルドを避ける (#681)。
          AEXCOMPAT_CANONICAL_WORKER: ${{ github.workspace }}\target\minihost-build\aex_render_worker.exe
          SDK_READY: ${{ steps.sdk.outcome }}
        run: |
          set "PSModulePath=%ProgramFiles%\WindowsPowerShell\Modules;%SystemRoot%\System32\WindowsPowerShell\v1.0\Modules;%PSModulePath%"
          set "SDK_FLAGS="
          if "%SDK_READY%"=="success" set "SDK_FLAGS=--run-sdk-tests --run-built-artifact-tests"
          uv run python -m pytest -q -rs -n auto --dist worksteal --durations=25 %SDK_FLAGS% --validate-local-artifact-manifest > pytest-output.txt 2>&1
          set PYTEST_EXIT=%ERRORLEVEL%
          type pytest-output.txt
          exit /b %PYTEST_EXIT%

      # AFTER_EFFECTS_SDK_ROOT が通っていれば SDK 由来の skip は 1 件も出ないはず。
      # 同様に、worker/probe をビルド済みなので built_artifact テストが成果物
      # 不在の inline skip で黙って skip されたら fail。
      - name: Fail if SDK or built-artifact tests were skipped
        if: steps.sdk.outcome == 'success'
        shell: pwsh
        run: |
          $leaks = Select-String -Path pytest-output.txt -Pattern 'SKIPPED' |
            Where-Object { $_.Line -match 'set AFTER_EFFECTS_SDK_ROOT|is not built|are not present' }
          if ($leaks) {
            $leaks | ForEach-Object { $_.Line }
            throw 'SDK or built-artifact tests were skipped even though their prerequisites are provisioned'
          }

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
