name: Windows clean clone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-reproducible:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: broker
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: broker
      # Python 版は .python-version (3.12) に従う。
      # setup-uv は v8 から floating major tag (@v8) を出していないので full tag で pin する。
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      - name: Check Rust workspace
        working-directory: broker
        run: cargo check --workspace --locked
      - name: Check AviUtl2 bridge
        run: cargo check --manifest-path bridges/aviutl2/Cargo.toml --locked
      - name: Test Rust workspace
        working-directory: broker
        # Hosted runners execute as a service account whose restricted token cannot
        # initialize even a static Rust worker (0xC0000142). Keep rejection tests in
        # CI, but leave positive restricted-token launch coverage to a local runner.
        run: >-
          cargo test --workspace --locked --
          --skip external_worker_reads_sealed_plugin_and_tree_is_cleaned_after_exit
          --skip timeout_kills_worker_and_cleans_sealed_and_staged_trees
      - name: Validate Python collection and local-artifact manifest
        run: uv run python -m pytest --collect-only -q --validate-local-artifact-manifest
      - name: Run source-reproducible Python tests
        run: uv run python -m pytest -q
