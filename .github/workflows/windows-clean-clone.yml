name: Windows clean clone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-reproducible:
    # Keep untrusted public-repository jobs off the physical workstation.
    # Private repositories use it only while the repository variable remains
    # explicitly enabled; setting USE_SELF_HOSTED_RUNNER=false (or deleting it)
    # provides an emergency GitHub-hosted fallback without a workflow edit.
    runs-on: ${{ github.event.repository.private && vars.USE_SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","windows-real"]') || 'windows-latest' }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      # clean clone は mtime が毎回新しく、rust-cache だけでは workspace
      # クレートが常に再コンパイルされる。sccache が内容ハッシュで吸収する (#664)。
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - name: Check Rust formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            $base = 'HEAD^'
          }
          $files = @(git diff --name-only --diff-filter=ACMR $base $env:GITHUB_SHA -- '*.rs')
          if (-not $files) {
            Write-Host 'No changed Rust files to format-check.'
            exit 0
          }
          rustfmt --edition 2024 --check --config skip_children=true @files
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            broker
            bridges/aviutl2
            bridges/aviutl2-multifilter
      # Python 版は .python-version (3.12) に従う。
      # setup-uv は v8 から floating major tag (@v8) を出していないので full tag で pin する。
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      - name: Check Rust workspace
        working-directory: broker
        run: cargo check --workspace --locked
      - name: Check AviUtl2 bridge
        run: cargo check --manifest-path bridges/aviutl2/Cargo.toml --all-targets --locked
      - name: Check AviUtl2 multifilter bridge
        run: cargo check --manifest-path bridges/aviutl2-multifilter/Cargo.toml --all-targets --locked
      # PR ゲートで minihost の C++ をコンパイルする (#884)。ae-sdk-tests の
      # 手動無効化 (#721) 以降、minihost を触る PR はコンパイルすら検証されずに
      # merge できた。minihost のビルドは AFTER_EFFECTS_SDK_ROOT を参照しない
      # ので、SDK fetch を持たないこの workflow に置ける。probe AEX のビルドと
      # SDK 付き pytest の復旧は ae-sdk-tests 側 (#721) が担当する。
      - name: Build minihost workers (Ninja)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S minihost -B target\minihost-build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build target\minihost-build || exit /b 1
          dir /b target\minihost-build\aex_*.exe
      # ヘッダ依存が実際に記録されているかを確認する (#657)。cl の /showIncludes
      # はローカライズされるため、configure 時と build 時で言語が食い違うと
      # ninja は依存を 0 件記録し、以後ヘッダを変えても再ビルドされない (#651)。
      - name: Verify minihost header dependency tracking
        shell: pwsh
        run: pwsh -File tools\verify-minihost-build-deps.ps1
      # Hosted runners execute as a service account whose restricted token cannot
      # initialize even a static Rust worker (0xC0000142). The tests that drive a
      # live worker detect that themselves now (broker/crates/broker/tests/common,
      # issue #335) and report a skip line instead of failing. Rejection tests that
      # never start a process keep running: RenderSession::open validates every
      # argument before it launches, and secure_launch fails trusted worker staging
      # before it spawns, so those refusals are still covered here. The old --skip
      # list is gone because it did not follow the tests added after it was
      # written, which left main red with 32 failures.
      #
      # --show-output is required, not cosmetic: libtest captures stdout/stderr of
      # passing tests, and a skipped test passes. Without it the skip lines are
      # swallowed and a run that could not launch a single worker is
      # indistinguishable from full coverage.
      - name: Test Rust workspace
        working-directory: broker
        shell: pwsh
        # The opt-in is what lets the probe suppress a worker-launching test at
        # all. Only the two CI workflows set it (here and in ae-sdk-tests.yml for
        # the pytest side), so a regression in the restricted token -- which
        # produces the same 0xC0000142 the probe keys on -- fails loudly on a
        # developer machine instead of skipping (issue #335).
        env:
          AEXCOMPAT_ALLOW_RESTRICTED_TOKEN_SKIP: "1"
        run: |
          cargo test --workspace --locked -- --show-output 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/cargo-test-output.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Make the environment limitation visible in the run summary rather than
      # leaving it as a passing test count. Reports either way, so "no skips" is
      # an explicit statement instead of the absence of one.
      - name: Report sealed-worker skips
        shell: pwsh
        if: always()
        run: |
          if (-not (Test-Path cargo-test-output.txt)) {
            Write-Host 'cargo test produced no log; nothing to report.'
            exit 0
          }
          $skips = Select-String -Path cargo-test-output.txt `
            -Pattern 'cannot launch a sealed worker'
          if ($skips) {
            Write-Host "::warning::$($skips.Count) Rust tests did not run: this runner cannot launch a sealed worker (issue #335)"
            $skips | ForEach-Object { $_.Line }
          } else {
            Write-Host 'Every worker-launching Rust test ran: no sealed-worker skips.'
          }
      - name: Validate Python collection and local-artifact manifest
        run: uv run python -m pytest --collect-only -q --validate-local-artifact-manifest
      # worksteal: ビルドでブロックした worker の積み残しを他の worker が
      # 引き取る。time_ns ファイル名の worker 間衝突は stamp への pid 付与で
      # 解消済みなので、モジュール直列化 (loadscope) はもう要らない (#668)。
      # dev_infra (レビュー運用スキルのテスト) は下の dev-infra job が担当 (#684)。
      - name: Run source-reproducible Python tests
        run: uv run python -m pytest -q -n auto --dist worksteal --durations=25 -m "not dev_infra"
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # 開発インフラ (codex-review-loop の bash/jq 関数) のテスト。中身は
  # プラットフォーム非依存の bash+jq で、プロセス起動が速い ubuntu で回す
  # 方が Windows 本体 job より数倍速い (#684)。
  dev-infra:
    # This job used Ubuntu originally, so return to it when the repository is
    # public or the self-hosted runner variable is disabled.
    runs-on: ${{ github.event.repository.private && vars.USE_SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","Windows","X64","windows-real"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --locked
      # skip はゲートする: bash/jq が見つからない環境ではこれらのテストは
      # pytest.skip になるが、それを緑として扱うと job の存在意義が消える。
      - name: Run dev-infra tests
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest -q -m dev_infra | tee pytest-infra.txt
          if grep -qE "[0-9]+ skipped" pytest-infra.txt; then
            echo "::error::dev-infra tests were skipped instead of running"
            exit 1
          fi
