name: Clean closed PR Actions caches

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      pull-request:
        description: Optional closed pull request number to clean immediately
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-closed-pr-caches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Scheduled/manual runs always execute the trusted default branch. Pull
      # request code and cache-provided executables are never evaluated here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete caches owned by closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_PULL_REQUEST: ${{ inputs.pull-request }}
        shell: bash
        run: |
          args=(--repository "$REPOSITORY")
          if [[ -n "$REQUESTED_PULL_REQUEST" ]]; then
            if [[ ! "$REQUESTED_PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]; then
              echo "requested pull request number is invalid" >&2
              exit 1
            fi
            args+=(--pull-request "$REQUESTED_PULL_REQUEST")
          fi
          python tools/cleanup-closed-pr-caches.py "${args[@]}"
