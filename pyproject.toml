[project]
name = "aexcompat-dev"
version = "0.0.0"
description = "Development-only Python dependency set for AEXCompat tests and tools (not a distributable package)"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "Pillow>=10.0,<13",
    "jsonschema>=4.0,<5",
    "OpenEXR>=3.3,<4",
    "git-filter-repo>=2.47,<3",
    "pytest-xdist>=3.8.0",
]
