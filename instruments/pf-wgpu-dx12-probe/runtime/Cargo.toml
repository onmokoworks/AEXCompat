[package]
name = "aexcompat-wgpu-dx12-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "=1.23.1", features = ["derive"] }
pollster = "=0.4.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
wgpu = { version = "=0.19.4", default-features = false, features = ["dx12", "hal", "wgsl"] }
winapi = { version = "=0.3.9", features = ["dxgi1_2"] }

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "debuginfo"
